<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Shield | Testador de Senhas</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="background"></div>

    <header>

        <h1>🛡️ Testador de Senhas</h1>

        <nav>

            <a href="index.html">Início</a>

            <a href="gerar.html">Gerar Senha</a>

        </nav>

    </header>

    <main>

        <!-- Campo da senha -->

        <section class="painel">

            <h2>Digite sua senha</h2>

            <div class="campo-senha">

                <input
                    type="password"
                    id="senhaTeste"
                    placeholder="Digite sua senha...">

                <button
                    class="toggleSenha"
                    id="mostrarSenha"
                    title="Mostrar senha">

                    👁

                </button>

            </div>

        </section>

        <!-- Barra -->

        <section class="painel">

            <h2>Nível de Segurança</h2>

            <div class="barra">

                <div id="forca"></div>

            </div>

            <p id="textoForca">

                Digite uma senha para iniciar a análise.

            </p>

        </section>

        <!-- Diagnóstico -->

        <section class="painel">

            <h2>Diagnóstico</h2>

            <ul id="listaResultado">

            </ul>

        </section>

    </main>

    <script src="testar.js"></script>

</body>

</html>
